name: Build Docker image for demo-game

on:
  push:
    branches:
      - main
      - dev
      - 'trpc-stack/**'
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/demo-game

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # No later step needs the git token; do not leave it in the checkout.
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        # The lint job builds the required workspace artifacts explicitly below;
        # skipping dependency postinstall downloads keeps CI independent of
        # unrelated native-binary mirrors.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint demo-game
        working-directory: ./apps/demo-game
        run: pnpm run lint

      # Type gate lives in this job (reusing its checkout/install) so it runs
      # fast, ahead of the slow Docker `build`. tsc resolves
      # `@gbl-uzh/platform/dist/*`, `@gbl-uzh/ui/dist/*` and the generated
      # Prisma client, so all must exist first (mirrors the local `dev`
      # prereqs and the Playwright workflow).
      - name: Build workspace packages
        run: |
          pnpm --filter @gbl-uzh/platform build
          pnpm --filter @gbl-uzh/ui build

      - name: Test platform
        run: pnpm --filter @gbl-uzh/platform test

      - name: Generate demo-game Prisma client
        working-directory: ./apps/demo-game
        run: |
          pnpm run prisma:copy
          pnpm run prisma:generate

      - name: Typecheck demo-game
        working-directory: ./apps/demo-game
        run: pnpm run check:ts

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # No later step needs the git token; do not leave it in the checkout.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push ${{ matrix.platform }} image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=demo-game-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=demo-game-${{ matrix.architecture }}

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=(*)

          if (( ${#digests[@]} == 0 )); then
            echo "No image digests were downloaded." >&2
            exit 1
          fi

          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in "${digests[@]}"; do
            args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

      - name: Inspect multi-architecture image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
