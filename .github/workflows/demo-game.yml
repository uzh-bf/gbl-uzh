name: Build Docker image for demo-game

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/demo-game

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # No later step needs the git token; do not leave it in the checkout.
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Lint demo-game
        working-directory: ./apps/demo-game
        run: pnpm run lint

      # Type gate lives in this job (reusing its checkout/install) so it runs
      # fast, ahead of the slow Docker `build`. tsc resolves
      # `@gbl-uzh/platform/dist/*`, `@gbl-uzh/ui/dist/*` and the generated
      # Prisma client, so all must exist first (mirrors the local `dev`
      # prereqs and the Playwright workflow).
      - name: Build workspace packages
        run: |
          pnpm --filter @gbl-uzh/platform build
          pnpm --filter @gbl-uzh/ui build

      - name: Test platform
        run: pnpm --filter @gbl-uzh/platform test

      - name: Generate demo-game Prisma client
        working-directory: ./apps/demo-game
        run: |
          pnpm run prisma:copy
          pnpm run prisma:generate

      - name: Typecheck demo-game
        working-directory: ./apps/demo-game
        run: pnpm run check:ts

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # No later step needs the git token; do not leave it in the checkout.
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
