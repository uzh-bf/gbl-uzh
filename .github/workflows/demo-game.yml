name: Build Docker image for demo-game

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/demo-game

jobs:
  # Skips everything below unless demo-game, one of its workspace dependencies
  # (packages/platform, packages/ui), the lockfile entries they use, root
  # config, or this workflow changed. turbo reads the pnpm workspace graph, the
  # same one `turbo prune` uses in apps/demo-game/Dockerfile.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      demo-game: ${{ steps.affected.outputs.demo-game }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether demo-game is affected
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          affected() {
            # No usable base (new branch, force push): build to be safe.
            git cat-file -e "${BASE:-0000000}^{commit}" 2>/dev/null || return 0
            git diff --quiet "$BASE...HEAD" -- .github/workflows/demo-game.yml .github/scripts/pin-demo-game-images.sh || return 0
            turbo_version=$(jq -r '.devDependencies.turbo' package.json)
            npx -y "turbo@$turbo_version" ls --filter="...[$BASE...HEAD]" --output=json |
              jq -e '.packages.items | any(.name == "@gbl-uzh/demo-game")' >/dev/null
          }
          if affected; then result=true; else result=false; fi
          echo "demo-game=$result" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.demo-game == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        # ESLint only reads the source tree, so no workspace package builds are
        # needed; skipping dependency postinstall downloads keeps CI independent
        # of unrelated native-binary mirrors.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint demo-game
        working-directory: ./apps/demo-game
        run: pnpm run lint

  build:
    needs: changes
    if: needs.changes.outputs.demo-game == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push ${{ matrix.platform }} image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=demo-game-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=demo-game-${{ matrix.architecture }}

      - name: Export image digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Separate ARM staging variant, excluded from the existing multi-arch manifest.
  build_startinvest_arm64:
    needs: changes
    if: needs.changes.outputs.demo-game == 'true' && (github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build isolated Startinvest ARM staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile
          platforms: linux/arm64
          build-args: APP_ENV=staging-arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-startinvest-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-startinvest-arm64-${{ github.sha }}
          cache-from: type=gha,scope=demo-game-startinvest-arm64
          cache-to: type=gha,mode=max,scope=demo-game-startinvest-arm64

  # Separate ARM production variant, matching the Startinvest staging build.
  build_startinvest_prd_arm64:
    needs: changes
    if: needs.changes.outputs.demo-game == 'true' && (github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build isolated Startinvest ARM production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile
          platforms: linux/arm64
          build-args: APP_ENV=production-arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prd-startinvest-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prd-startinvest-arm64-${{ github.sha }}
          cache-from: type=gha,scope=demo-game-startinvest-prd-arm64
          cache-to: type=gha,mode=max,scope=demo-game-startinvest-prd-arm64

  # Migration image for the Argo CD PreSync hook in deploy/demo-game/{stg,prd}.
  # Built here (not only in demo-game-migration.yml) so deploy_stg can wait for it.
  build_migration_arm64:
    needs: changes
    if: needs.changes.outputs.demo-game == 'true' && (github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev'))
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 migration image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile.migration
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-migration
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-migration-${{ github.sha }}
          cache-from: type=gha,scope=demo-game-migration-arm64
          cache-to: type=gha,mode=max,scope=demo-game-migration-arm64

  # Pins the new STG images in deploy/demo-game/stg; Argo CD auto-syncs STG.
  # PRD digests are committed by hand in deploy/demo-game/prd and synced by hand.
  deploy_stg:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # Lint must pass too; skipped jobs (nothing affected) skip the deploy.
    needs: [lint, build_startinvest_arm64, build_migration_arm64]
    runs-on: ubuntu-latest
    concurrency:
      group: demo-game-deploy-stg
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      OVERLAY: deploy/demo-game/stg
      APP_DIGEST: ${{ needs.build_startinvest_arm64.outputs.digest }}
      MIGRATION_DIGEST: ${{ needs.build_migration_arm64.outputs.digest }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Pin STG image digests
        run: .github/scripts/pin-demo-game-images.sh "$OVERLAY" "$GITHUB_SHA" "$APP_DIGEST" "$MIGRATION_DIGEST"

  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=(*)

          if (( ${#digests[@]} == 0 )); then
            echo "No image digests were downloaded." >&2
            exit 1
          fi

          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in "${digests[@]}"; do
            args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

      - name: Inspect multi-architecture image
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
