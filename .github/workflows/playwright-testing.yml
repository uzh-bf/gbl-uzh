name: Demo Game Playwright

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/demo-game/**
      - examples/central-bank/**
      - examples/rate-wars/**
      - packages/platform/**
      - packages/ui/**
      - playwright/**
      - .github/workflows/playwright-testing.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  CYPRESS_INSTALL_BINARY: "0"
  pnpm_config_verify_deps_before_run: "false"
  DATABASE_URL: postgres://prisma:prisma@postgres:5432/prisma?schema=public&connection_limit=20
  SHADOW_DATABASE_URL: postgres://prisma:prisma@postgres:5432/shadow?schema=public&connection_limit=20
  NEXTAUTH_SECRET: ci-demo-game-not-a-secret
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3000/api/graphql
  GBL_AUTH_MODE: mock
  GBL_MOCK_OIDC_ISSUER: http://oidc:8090/default
  GBL_MOCK_OIDC_CLIENT_ID: demo-game-local
  GBL_MOCK_OIDC_CLIENT_SECRET: demo-game-local-secret
  PLAYWRIGHT_BASE_URL: http://localhost:3000

jobs:
  design-system-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable design-system source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uzh-bf/design-system
          ref: e49a96a4b705a296cb4f337d9d788ead344bac85

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.30.0
          run_install: false

      - name: Build and verify exact candidate archive
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @uzh-bf/design-system build
          mkdir candidate
          (cd packages/design-system && pnpm pack --pack-destination ../../candidate)
          echo 'b237f0d7f9b384c84f4027768d5c5391e72e22591c1146ef890f0603a7994f06  candidate/uzh-bf-design-system-5.0.0-alpha.5.tgz' | sha256sum --check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-system-rhf-candidate
          path: candidate/*.tgz
          retention-days: 1
          if-no-files-found: error

  playwright-run:
    needs: [design-system-candidate]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        game: [demo-game, rate-wars, central-bank]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.11
        env:
          SERVER_PORT: "8090"
          JSON_CONFIG: >-
            {
              "interactiveLogin": false,
              "tokenCallbacks": [
                {
                  "issuerId": "default",
                  "requestMappings": [
                    {
                      "requestParam": "grant_type",
                      "match": "*",
                      "claims": {
                        "sub": "dev-admin",
                        "email": "gbl-dev@df.uzh.ch",
                        "name": "GBL Dev",
                        "email_verified": true
                      }
                    }
                  ]
                }
              ]
            }

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Define node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache turbo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact demo-game candidate
        if: matrix.game == 'demo-game'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: design-system-rhf-candidate
          path: project/_local/design-system-candidate

      - name: Install exact demo-game candidate graph
        if: matrix.game == 'demo-game'
        shell: bash
        run: |
          archive="$PWD/project/_local/design-system-candidate/uzh-bf-design-system-5.0.0-alpha.5.tgz"
          restore_root="$RUNNER_TEMP/design-system-candidate-originals"
          mkdir -p "$restore_root/apps/demo-game" "$restore_root/packages/ui"
          cp apps/demo-game/package.json "$restore_root/apps/demo-game/package.json"
          cp packages/ui/package.json "$restore_root/packages/ui/package.json"
          cp pnpm-lock.yaml "$restore_root/pnpm-lock.yaml"
          echo "DS_CANDIDATE_RESTORE_ROOT=$restore_root" >> "$GITHUB_ENV"

          echo "b237f0d7f9b384c84f4027768d5c5391e72e22591c1146ef890f0603a7994f06  $archive" | sha256sum --check
          node --input-type=module - "$archive" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const archive = process.argv[2]
          for (const [file, section] of [
            ['apps/demo-game/package.json', 'dependencies'],
            ['packages/ui/package.json', 'devDependencies'],
          ]) {
            const manifest = JSON.parse(readFileSync(file, 'utf8'))
            manifest[section]['@uzh-bf/design-system'] = `file:${archive}`
            writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n')
          }
          JS
          pnpm install --lockfile-only
          receipt_root="$PWD/project/_local/design-system-candidate-evidence"
          mkdir -p "$receipt_root"
          cp apps/demo-game/package.json "$receipt_root/demo-game-package.json"
          cp packages/ui/package.json "$receipt_root/ui-package.json"
          cp pnpm-lock.yaml "$receipt_root/pnpm-lock.yaml"
          pnpm install --frozen-lockfile

      - name: Build demo-game dependencies
        run: |
          pnpm --filter @gbl-uzh/platform build
          pnpm --filter @gbl-uzh/ui build

      - name: Verify effective game package graph
        shell: bash
        run: |
          game_path=examples/${{ matrix.game }}
          if [ '${{ matrix.game }}' = demo-game ]; then game_path=apps/demo-game; fi
          args=(--workspace "$PWD/$game_path" --evidence "$PWD/project/_local/game-proof")
          if [ '${{ matrix.game }}' = demo-game ]; then
            args+=(--design-system "file:$PWD/project/_local/design-system-candidate/uzh-bf-design-system-5.0.0-alpha.5.tgz" --expected-sha256 b237f0d7f9b384c84f4027768d5c5391e72e22591c1146ef890f0603a7994f06)
          fi
          pnpm --filter @gbl-uzh/ui verify:consumer "${args[@]}"

      - name: Verify packed UI consumer
        shell: bash
        run: |
          pnpm --filter @gbl-uzh/ui verify:package --output "$PWD/project/_local/ui-package"
          args=(--package "$PWD/project/_local/ui-package/gbl-uzh-ui-0.4.13.tgz" --evidence "$PWD/project/_local/consumer-proof")
          if [ '${{ matrix.game }}' = demo-game ]; then
            args+=(--design-system "file:$PWD/project/_local/design-system-candidate/uzh-bf-design-system-5.0.0-alpha.5.tgz" --expected-sha256 b237f0d7f9b384c84f4027768d5c5391e72e22591c1146ef890f0603a7994f06)
          else
            args+=(--design-system 4.1.6)
          fi
          pnpm --filter @gbl-uzh/ui verify:consumer "${args[@]}" --browser-test

      - name: Prepare database
        run: |
          pnpm --filter @gbl-uzh/${{ matrix.game }} prisma:copy
          pnpm --filter @gbl-uzh/${{ matrix.game }} prisma:generate

          push_ok=0
          for attempt in $(seq 1 12); do
            if pnpm --filter @gbl-uzh/${{ matrix.game }} prisma:push; then
              push_ok=1
              break
            fi
            echo "prisma push attempt ${attempt} failed; retrying in 5s"
            sleep 5
          done

          if [ "$push_ok" != 1 ]; then
            echo "prisma push never succeeded" >&2
            exit 1
          fi

          pnpm --filter @gbl-uzh/${{ matrix.game }} prisma:seed

      - name: Start ${{ matrix.game }} and run Playwright
        timeout-minutes: 60
        run: |
          pnpm --filter @gbl-uzh/${{ matrix.game }} dev > service.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for url in \
            "http://oidc:8090/default/.well-known/openid-configuration" \
            "http://localhost:3000/admin/login"
          do
            ready=0
            for attempt in $(seq 1 90); do
              if curl -fsS "$url" >/dev/null; then
                ready=1
                break
              fi
              echo "waiting for ${url} (${attempt}/90)"
              sleep 5
            done

            if [ "$ready" != 1 ]; then
              echo "service did not become ready: ${url}" >&2
              tail -n 200 service.log >&2 || true
              exit 1
            fi
          done

          pnpm --dir playwright exec playwright test \
            --project=chromium \
            tests/${{ matrix.game }}-flow.spec.ts

      - name: Restore registry manifests after candidate verification
        if: always() && matrix.game == 'demo-game'
        shell: bash
        run: |
          restore_root="${DS_CANDIDATE_RESTORE_ROOT:-}"
          if [ -z "$restore_root" ]; then exit 0; fi
          cp "$restore_root/apps/demo-game/package.json" apps/demo-game/package.json
          cp "$restore_root/packages/ui/package.json" packages/ui/package.json
          cp "$restore_root/pnpm-lock.yaml" pnpm-lock.yaml

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.game }}
          path: playwright/blob-report
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.game }}
          path: |
            playwright/test-results
            service.log
            project/_local/consumer-proof
            project/_local/design-system-candidate-evidence
            project/_local/game-proof
          retention-days: 7
          if-no-files-found: ignore

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-run]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Define node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        working-directory: playwright
        run: pnpm exec playwright merge-reports --reporter html ../all-blob-reports

      - name: Upload merged HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 30
