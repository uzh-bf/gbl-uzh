name: Build Demo Game migration image

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uzh-bf/gbl-uzh/demo-game

jobs:
  build_migration_arm64:
    name: Build ARM64 migration image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo-game/Dockerfile.migration
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-migration
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-migration-${{ github.sha }}
          cache-from: type=gha,scope=demo-game-migration-arm64
          cache-to: type=gha,mode=max,scope=demo-game-migration-arm64
