name: Release UI Package

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Use npm 11
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        working-directory: packages/ui
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PACKAGE_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @gbl-uzh/ui@${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Lint
        working-directory: packages/ui
        run: pnpm run lint

      - name: Build
        working-directory: packages/ui
        run: pnpm run build

      - name: Verify package artifact
        working-directory: packages/ui
        run: pnpm run verify:package -- --output "${RUNNER_TEMP}/gbl-ui-package"

      - name: Preserve verified package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gbl-ui-package
          path: ${{ runner.temp }}/gbl-ui-package/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Verify external Next consumer
        working-directory: packages/ui
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          pnpm run verify:consumer -- --package "${RUNNER_TEMP}/gbl-ui-package/gbl-uzh-ui-${PACKAGE_VERSION}.tgz"

  publish:
    name: Publish verified artifact
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Use Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install --global npm@11.13.0

      - name: Download verified package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gbl-ui-package
          path: ${{ runner.temp }}/gbl-ui-package

      - name: Publish
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          npm publish "${RUNNER_TEMP}/gbl-ui-package/gbl-uzh-ui-${PACKAGE_VERSION}.tgz" --ignore-scripts
