name: TypeScript checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/package.json'
      - '**/tsconfig*.json'
      - '**/*.prisma'
      - '.github/workflows/typescript-checks.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.quartz.json'
      - 'types/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://prisma:prisma@127.0.0.1:5432/prisma?schema=public
  SHADOW_DATABASE_URL: postgres://prisma:prisma@127.0.0.1:5432/shadow?schema=public

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma clients and platform distribution
        run: |
          set -euo pipefail
          pnpm --filter @gbl-uzh/platform build
          pnpm --filter @gbl-uzh/ui build
          for game in demo-game central-bank rate-wars; do
            pnpm --filter "@gbl-uzh/${game}" prisma:copy
            pnpm --filter "@gbl-uzh/${game}" prisma:generate
          done

      - name: Run TypeScript 7 checks
        run: |
          set -euo pipefail
          pnpm run check:ts:quartz
          pnpm --filter @gbl-uzh/platform check:ts
          pnpm --filter @gbl-uzh/ui check:ts
          pnpm --filter @gbl-uzh/demo-game check:ts
          pnpm --filter @gbl-uzh/central-bank check:ts
          pnpm --filter @gbl-uzh/rate-wars check:ts
          pnpm --filter @gbl-uzh/website check:ts
          pnpm --filter @gbl-uzh/cypress check:ts
          pnpm --filter @gbl-uzh/playwright check:ts

      - name: Run TypeScript 6 checks
        run: |
          set -euo pipefail
          pnpm run check:ts:quartz:typescript6
          pnpm --filter @gbl-uzh/platform check:ts:typescript6
          pnpm --filter @gbl-uzh/ui check:ts:typescript6
          pnpm --filter @gbl-uzh/demo-game check:ts:typescript6
          pnpm --filter @gbl-uzh/central-bank check:ts:typescript6
          pnpm --filter @gbl-uzh/rate-wars check:ts:typescript6
          pnpm --filter @gbl-uzh/website check:ts:typescript6
          pnpm --filter @gbl-uzh/cypress check:ts:typescript6
          pnpm --filter @gbl-uzh/playwright check:ts:typescript6

  # Runs the demo game's database-gated integration tests against a real
  # Postgres. They cover classroom-scale concurrency: simultaneous shared-link
  # joins, simultaneous action submits and segment-ending transitions, which
  # only hold while the platform takes its game row locks. Each suite skips
  # itself unless its flag is set, so the flags below must stay in sync with
  # the files listed in the test step.
  database-tests:
    name: Demo game database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REGISTRATION_DATABASE_TESTS: '1'
      FINISH_GAME_DATABASE_TESTS: '1'
      GAMEPLAY_DATABASE_TESTS: '1'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.6.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build platform and seed the demo game database
        run: |
          set -euo pipefail
          pnpm --filter @gbl-uzh/platform build
          pnpm --filter @gbl-uzh/ui build
          pnpm --filter @gbl-uzh/demo-game prisma:copy
          pnpm --filter @gbl-uzh/demo-game prisma:generate
          pnpm --filter @gbl-uzh/demo-game prisma:push
          pnpm --filter @gbl-uzh/demo-game prisma:seed

      - name: Run database integration tests
        working-directory: apps/demo-game
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            --reporter=verbose --reporter=json \
            --outputFile.json="$RUNNER_TEMP/database-tests.json" \
            src/services/RegistrationService.integration.test.ts \
            src/services/FinishGame.integration.test.ts \
            src/services/PlayService.integration.test.ts
          # A renamed flag would skip a suite and still exit 0; fail instead.
          jq -e '.numPendingTests == 0 and .numTodoTests == 0 and .numPassedTests > 0' \
            "$RUNNER_TEMP/database-tests.json"
