# Proxy-only, routed over devnet by container name (NO published host ports): the
# devcontainer owns the environment (toolchain, Postgres, the local OIDC mock,
# install/build/seed, the selected `GBL_GAME_TARGET` dev server); devrouter's Traefik fronts everything on
# the shared :443 / :5432. Many projects coexist with zero port collisions.
#
# Usage: `dev up` + `dev tls install` (creates devnet + the mkcert CA), THEN
# bring the devcontainer up (devnet is external — must pre-exist), then
# `for a in app oidc db; do dev app run "$a" --yes; done`. Requires devrouter >= 0.0.31.
version: 1
devrouter:
  version: 0.0.31
project:
  name: demo-game
apps:
  # App: https://demo-game.localhost -> the `${WORKSPACE}-app` devnet alias.
  - name: app
    host: demo-game.localhost
    protocol: http
    runtime: proxy
    upstream: ${WORKSPACE}-app:3000

  # Local OIDC mock — owns a workspace-scoped devnet alias so app recreation does
  # not break the issuer. Browser + app server both use the routed host.
  - name: oidc
    host: oidc.demo-game.localhost
    protocol: http
    runtime: proxy
    upstream: ${WORKSPACE}-oidc:8090

  # Postgres: db.demo-game.localhost:5432 -> `${WORKSPACE}-db` (SNI). Connect with
  # direct-SSL: psql "host=db.demo-game.localhost port=5432 user=prisma
  # password=prisma dbname=prisma sslmode=require sslnegotiation=direct"
  - name: db
    host: db.demo-game.localhost
    protocol: tcp
    tcpProtocol: postgres
    runtime: proxy
    upstream: ${WORKSPACE}-db:5432
