fragment PlayerData on Player {
  id

  isReady

  role

  name
  facts

  experience
  experienceToNext


  game {
    id
    name
    status
    facts
    activePeriod {
      index
      activeSegmentIx
    }
  }

  achievementKeys
  achievements {
    id
    count
    periodIx

    achievement {
      id
      name
      description
      image
      when
      scope
      activePeriods
      reward
    }
  }

  level {
    id
    index
  }
}
