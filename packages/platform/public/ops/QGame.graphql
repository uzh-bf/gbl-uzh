#import "./FGameData.graphql"
#import "./FPlayerData.graphql"

query Game($id: Int, $includeFacts: Boolean!) {
  game(id: $id) {
    ...GameData
    activePeriod {
      id
      activeSegmentIx
      activeSegment {
        id
        countdownExpiresAt
        countdownDurationMs
      }
      segmentCount
      segments {
        id
      }
    }
    periods {
      id

      index
      activeSegmentIx

      facts @include(if: $includeFacts)

      segments {
        id

        index

        countdownExpiresAt
        countdownDurationMs

        facts @include(if: $includeFacts)

        learningElements {
          id
          title
        }

        storyElements {
          id
          title
        }
      }
      segmentCount
    }
    players {
      id

      isReady

      role

      number
      name

      facts

      experience
      experienceToNext
      token
    }
  }
}
