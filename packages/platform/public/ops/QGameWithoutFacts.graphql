#import "./FGameData.graphql"
#import "./FPlayerData.graphql"

query GameWithoutFacts($id: Int) {
  gameWithoutFacts(id: $id) {
    ...GameData
    activePeriod {
      id
      activeSegmentIx
      activeSegment {
        id
        countdownExpiresAt
        countdownDurationMs
      }
      segmentCount
      segments {
        id
      }
    }
    periods {
      id

      index
      activeSegmentIx

      segments {
        id

        index

        countdownExpiresAt
        countdownDurationMs

        learningElements {
          id
          title
        }

        storyElements {
          id
          title
        }
      }
      segmentCount
    }
    players {
      id

      isReady

      role

      number
      name

      facts

      experience
      experienceToNext
      token
    }
  }
}
