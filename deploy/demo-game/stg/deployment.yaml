apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-game
  labels:
    app.kubernetes.io/name: demo-game
spec:
  replicas: 1
  # The application uses process-local pub/sub, so only one pod may run.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-game
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-game
    spec:
      serviceAccountName: stg-gbl-demo
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: demo-game
          # Digest pinned in kustomization.yaml (images: demo-game).
          image: demo-game
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: demo-game-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stg-gbl-demo-secrets
                  key: DATABASE_URL
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stg-gbl-demo-secrets
                  key: AUTH0_CLIENT_ID
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stg-gbl-demo-secrets
                  key: AUTH0_CLIENT_SECRET
            - name: AUTH0_ISSUER
              valueFrom:
                secretKeyRef:
                  name: stg-gbl-demo-secrets
                  key: AUTH0_ISSUER
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stg-gbl-demo-secrets
                  key: NEXTAUTH_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
