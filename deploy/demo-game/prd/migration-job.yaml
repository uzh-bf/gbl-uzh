apiVersion: batch/v1
kind: Job
metadata:
  name: demo-game-migrate
  labels:
    app.kubernetes.io/name: demo-game
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-game-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: prd-gbl-demo
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: migrate
          # Digest pinned in kustomization.yaml (images: demo-game-migration).
          image: demo-game-migration
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/demo-game
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ./node_modules/.bin/prisma migrate deploy --config=prisma.config.ts
              ./node_modules/.bin/prisma db execute --config=prisma.config.ts --stdin <<'SQL'
              INSERT INTO "PlayerLevel" ("index", "description", "image", "requiredXP")
              VALUES
                (0, 'Hello, World', 'levels/0.png', 0),
                (1, 'Starting Out', 'levels/1.png', 100),
                (2, 'Levelling Up', 'levels/2.png', 500),
                (3, 'Advancing Further', 'levels/3.png', 1000),
                (4, 'Achieving Mastery', 'levels/4.png', 3000)
              ON CONFLICT ("index") DO NOTHING;
              SQL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prd-gbl-demo-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
