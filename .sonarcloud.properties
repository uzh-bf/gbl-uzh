# Read by SonarCloud automatic analysis (no CI-based scanner in this repo).
# The demo game is the scaffold every example game copies (docs/adr/0002), so
# the per-app NextAuth glue is intentionally identical across apps; it cannot
# move into @gbl-uzh/platform because it imports app-local prisma/jwt modules.
sonar.cpd.exclusions=apps/*/src/lib/authOptions.ts,examples/*/src/lib/authOptions.ts
