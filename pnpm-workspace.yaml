packages:
  - 'apps/*'
  - '!apps/escapp'
  - '!apps/quartz'
  - 'packages/*'
  - 'examples/*'
  - cypress
  - playwright
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  core-js: false
  cypress: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # demo-game runs Next 16 + React 19; several of its deps declare a React 18
  # peer with a *capped* range (`^18`), so pnpm installs a second react@18 copy
  # for them. With one React instance required (Turbopack has no per-bundle react
  # alias to dedupe, so a duplicate breaks its build with "Cannot read properties
  # of null (reading 'useState')"), force these onto React 19. Selectors are
  # version/parent-scoped so the website app (still Next 15 + React 18 +
  # design-system v3) is untouched — and @gbl-uzh/ui is consumed only by the
  # React 19 apps. Shared deps with open peers (react-markdown `>=16`,
  # react-fontawesome `>=16.3`) resolve per-consumer automatically and need no
  # override.
  'next@16>react': '^19.0.0'
  'next@16>react-dom': '^19.0.0'
  '@uzh-bf/design-system@4>react': '^19.0.0'
  '@uzh-bf/design-system@4>react-dom': '^19.0.0'
  '@gbl-uzh/ui>react': '^19.0.0'
  '@gbl-uzh/ui>react-dom': '^19.0.0'
  # react-dice-complete@2.2.0 peer-deps React <=18; force it onto React 19 so
  # there is a single React instance. Die.tsx wrapper unchanged.
  'react-dice-complete>react': '^19.0.0'
  'react-dice-complete>react-dom': '^19.0.0'
  # The workspace mixes Font Awesome 6.6.0 (website, legacy) and 6.7.2
  # (demo-game/ui). fontawesome-common-types holds the IconProp/IconPrefix
  # types; two copies make IconDefinition vs IconProp nominally incompatible
  # and break @gbl-uzh/ui's tsc. Pin one (6.7.2 is a superset) so the type is
  # identical everywhere.
  '@fortawesome/fontawesome-common-types': '6.7.2'
