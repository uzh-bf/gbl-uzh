packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'
  - cypress
  - playwright
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  core-js: false
  cypress: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# These are duplicated in package.json under `pnpm.overrides`, and the two
# copies must stay identical. Vercel builds with pnpm 9 ("Using pnpm@9.x based
# on project creation date"), which reads overrides only from package.json —
# dropping that copy fails its frozen install with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Local pnpm 11 reads only this file and
# warns about the package.json copy on every command. Both copies can go once
# the Vercel project opts into pnpm 10+ via corepack.
overrides:
  # react-dice-complete@2.2.0 peer-deps React <=18; force it onto the
  # workspace React 19 so there is a single React instance (avoids a duplicate
  # React that would break hooks). Die.tsx wrapper unchanged.
  'react-dice-complete>react': '^19.0.0'
  'react-dice-complete>react-dom': '^19.0.0'
  # The workspace mixes Font Awesome 6.6.0 (website, legacy) and 6.7.2
  # (demo-game/ui). fontawesome-common-types holds the IconProp/IconPrefix
  # types; two copies make IconDefinition vs IconProp nominally incompatible
  # and break @gbl-uzh/ui's tsc. Pin one (6.7.2 is a superset) so the type is
  # identical everywhere.
  '@fortawesome/fontawesome-common-types': '6.7.2'
