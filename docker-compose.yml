# Host-mode services: run the app natively (`pnpm dev`) against dockerized
# Postgres and the local OIDC mock, both published on loopback only. This file
# is NOT used by the devcontainer configs — those live in `.devcontainer/`
# (devrouter mode) and `.devcontainer/starter/` (starter mode) and carry their
# own networking. All three modes share `.devcontainer/docker/` for the OIDC
# mock config and the shadow-DB init script.
#
#   pnpm install
#   pnpm bootstrap [game]              # also runs `docker compose up -d --wait`
#   pnpm dev [game]                    # then open http://localhost:3000
#
# Ports are overridable when 5432/8090 are taken on your machine (e.g. by a
# local Postgres or by devrouter's Traefik): GBL_DB_PORT / GBL_OIDC_PORT.
# Overrides must be mirrored on the app side, which reads its defaults from
# apps/demo-game/.env*:
#   GBL_DB_PORT   -> also override DATABASE_URL + SHADOW_DATABASE_URL
#   GBL_OIDC_PORT -> also override GBL_MOCK_OIDC_ISSUER
#   PORT (next dev, when 3000 is taken)
#                 -> also override NEXTAUTH_URL + NEXT_PUBLIC_APP_URL
#                    + NEXT_PUBLIC_API_URL
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: prisma
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prisma -d prisma']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:${GBL_DB_PORT:-5432}:5432'
    volumes:
      - ./.devcontainer/docker/init-shadow-db.sql:/docker-entrypoint-initdb.d/01-init-shadow-db.sql:ro
      - pgdata:/var/lib/postgresql/data

  # Local OIDC provider (Auth0 replacement). Published on loopback, so
  # http://localhost:8090/default is the SAME mock issuer for the browser
  # (authorize) and the app server (discovery/token/jwks) — the token `iss`
  # matches without TLS or extra host mappings.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.11
    environment:
      SERVER_PORT: '8090'
      # Shared config (one-click auto-login as the fixed dev admin, constant
      # `sub` across restarts) — single source for all run modes.
      JSON_CONFIG_PATH: /etc/mock-oauth2/config.json
    ports:
      - '127.0.0.1:${GBL_OIDC_PORT:-8090}:8090'
    volumes:
      - ./.devcontainer/docker/oidc-config.json:/etc/mock-oauth2/config.json:ro

volumes:
  pgdata:
